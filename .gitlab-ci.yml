# GitLab CI for drupal.org (git.drupalcode.org).
#
# Until this file existed, vvj_core had NO pipeline at all: drupal.org runs a
# project's jobs only when the project supplies this file and includes the
# Drupal Association templates. Every push and every merge request landed
# unchecked — no Composer validate, no PHPCS, no PHPStan, no PHPUnit — while
# the repository carried a phpcs.xml.dist and a phpstan.neon that looked like a
# quality gate and gated nothing.
#
# The templates are centrally maintained by the DA, so pinning the three
# includes below keeps this project current without edits here.
# Docs: https://project.pages.drupalcode.org/gitlab_templates/
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

################
# Test every core version this module actually claims.
#
# `vvj_core.info.yml` declares `core_version_requirement: ^11.3 || ^12`, but the
# DA template tests only the CURRENT core version by default; every other
# variant defaults to off. A module can therefore advertise support for a core
# version that no job has ever loaded it on. That is not hypothetical — it is
# how cloudflare_purge 3.1.2 shipped a class that was fatal to autoload on
# Drupal 10 with a fully green pipeline (drupal.org #3614126).
#
# TWO SWITCHES ARE NEEDED PER VARIANT, NOT ONE. `OPT_IN_TEST_*` decides whether
# the job is created at all; `_AUTORUN_*` decides whether it runs on its own or
# falls through to *make-job-manual. Both template defaults ('0' and 'none')
# have to be overridden. Set only the first and the job appears in the pipeline
# and is then silently skipped behind a manual prerequisite — a green pipeline
# with no coverage, which is worse than a missing job because it looks fine.
#
# PREVIOUS MINOR is on because `^11.3` is a real claim: current core has moved
# past 11.3, so without this job the oldest version this module says it
# supports is never exercised.
#
# NEXT MAJOR is on because `^12` is a real claim too. The template marks these
# jobs `allow_failure: true`, so this does not gate a merge — it makes a D12
# break visible instead of leaving it to a site owner to find.
#
# (An earlier version of this paragraph cited cloudflare_purge as the
# counter-example, "deliberately leaves this off because its branch does NOT
# claim ^12". That stopped being true on 2026-09-07: cloudflare_purge was
# ported to Drupal 12, the claim landed in its info.yml, and its next-major
# jobs were switched on. Corrected rather than left as a confident aside that
# has quietly gone stale.)
#
# PREVIOUS MAJOR is deliberately absent: this module does not claim Drupal 10,
# so testing it there would assert support that info.yml does not offer.
################
variables:
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  OPT_IN_TEST_NEXT_MAJOR: '0'
  _AUTORUN_NEXT_MAJOR: 'all'
