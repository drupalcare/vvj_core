# GitLab CI for drupal.org (git.drupalcode.org).
#
# Until this file existed, vvj_core had NO pipeline at all: drupal.org runs a
# project's jobs only when the project supplies this file and includes the
# Drupal Association templates. Every push and every merge request landed
# unchecked — no Composer validate, no PHPCS, no PHPStan, no PHPUnit — while
# the repository carried a phpcs.xml.dist and a phpstan.neon that looked like a
# quality gate and gated nothing.
#
# The templates are centrally maintained by the DA, so pinning the three
# includes below keeps this project current without edits here.
# Docs: https://project.pages.drupalcode.org/gitlab_templates/
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

################
# Test every core version this module actually claims.
#
# `vvj_core.info.yml` declares `core_version_requirement: ^11.3 || ^12`, but the
# DA template tests only the CURRENT core version by default; every other
# variant defaults to off. A module can therefore advertise support for a core
# version that no job has ever loaded it on. That is not hypothetical — it is
# how cloudflare_purge 3.1.2 shipped a class that was fatal to autoload on
# Drupal 10 with a fully green pipeline (drupal.org #3614126).
#
# TWO SWITCHES ARE NEEDED PER VARIANT, NOT ONE. `OPT_IN_TEST_*` decides whether
# the job is created at all; `_AUTORUN_*` decides whether it runs on its own or
# falls through to *make-job-manual. Both template defaults ('0' and 'none')
# have to be overridden. Set only the first and the job appears in the pipeline
# and is then silently skipped behind a manual prerequisite — a green pipeline
# with no coverage, which is worse than a missing job because it looks fine.
#
# PREVIOUS MINOR is on because `^11.3` is a real claim: current core has moved
# past 11.3, so without this job the oldest version this module says it
# supports is never exercised.
#
# NEXT MAJOR is on because `^12` is a real claim too. The template marks these
# jobs `allow_failure: true`, so this does not gate a merge — it makes a D12
# break visible instead of leaving it to a site owner to find.
#
# (An earlier version of this paragraph cited cloudflare_purge as the
# counter-example, "deliberately leaves this off because its branch does NOT
# claim ^12". That stopped being true on 2026-09-07: cloudflare_purge was
# ported to Drupal 12, the claim landed in its info.yml, and its next-major
# jobs were switched on. Corrected rather than left as a confident aside that
# has quietly gone stale.)
#
# PREVIOUS MAJOR is deliberately absent: this module does not claim Drupal 10,
# so testing it there would assert support that info.yml does not offer.
################
variables:
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  OPT_IN_TEST_NEXT_MAJOR: '0'
  _AUTORUN_NEXT_MAJOR: 'all'

################
# VVJ CSS cascade check (static, no site, no browser).
#
# scripts/check-vvj-cascade.py compares which CSS declaration wins on each VVJ
# element, before and after this change, and fails on a changed winner, a new
# Pattern selector above 0,2,0, a new P4 loss or a new P5 token-ownership breach.
# It reads ALL eleven VVJ repos, so a pipeline of vvj_core alone cannot run it:
# the ten format modules are cloned (depth 1, default branch) from
# git.drupalcode.org/project/<name>.git next to a copy of this checkout.
#   - If any of the ten cannot be cloned, the job prints SKIPPED and the names,
#     and the check did NOT run. It never reports a pass for a check that did not run.
#   - Baseline: vvj_core at the merge-request base ($CI_MERGE_REQUEST_DIFF_BASE_SHA)
#     or, on a push, HEAD~1. The ten modules are the same clone on both sides, so
#     only a vvj_core change can move a winner. Module-side regressions are caught
#     by the same check in the module's own change set run locally (see AGENTS.md).
#   - If the base commit is not in the shallow clone and cannot be fetched, SKIPPED.
#   - Solo and solo_utilities are cloned the same way (optional; the script prints
#     "not found, skipped" for Solo when absent). Olivero is NOT fetched: the
#     Olivero side is not compared in CI (needs checking: a sparse clone of
#     drupal/core core/themes/olivero would add it).
# Python is not assumed in the template's PHP image (needs checking), so the job
# uses python:3.12-bookworm (python3 + git; needs checking on the first pipeline).
# Coverage line to read in the log: "base <sha> (11 repos)". The job fails if it
# is not 11.
################
vvj-cascade:
  stage: validate
  image: python:3.12-bookworm
  script:
    - |
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$BASE" ]; then BASE=$(git rev-parse -q --verify HEAD~1 || true); fi
      if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
        git fetch --quiet --depth=100 origin ${BASE:+"$BASE"} 2>/dev/null || git fetch --quiet --deepen=50 2>/dev/null || true
        if [ -z "$BASE" ]; then BASE=$(git rev-parse -q --verify HEAD~1 || true); fi
      fi
      if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
        echo "SKIPPED vvj-cascade: no base commit available (shallow clone, nothing to compare against). The check did NOT run."
        exit 0
      fi
      echo "baseline commit: $BASE"
      LANE=$(mktemp -d "${TMPDIR:-/tmp}/vvj-lane.XXXXXX")
      BEFORE=$(mktemp -d "${TMPDIR:-/tmp}/vvj-before.XXXXXX")
      cp -R "$CI_PROJECT_DIR" "$LANE/vvj_core"
      MISSING=""
      for m in vvja vvjb vvjc vvjf vvjh vvjl vvjp vvjr vvjs vvjt; do
        git clone --quiet --depth 1 "https://git.drupalcode.org/project/$m.git" "$LANE/$m" || MISSING="$MISSING $m"
      done
      if [ -n "$MISSING" ]; then
        echo "SKIPPED vvj-cascade: could not clone from git.drupalcode.org:$MISSING. The check needs all ten format modules and did NOT run."
        exit 0
      fi
      for s in solo solo_utilities; do
        git clone --quiet --depth 1 "https://git.drupalcode.org/project/$s.git" "$LANE/$s" || echo "note: $s not fetched; the Solo side is not compared"
      done
      echo "note: Olivero is not fetched; the Olivero side is not compared"
      mkdir "$BEFORE/vvj_core"
      git -C "$LANE/vvj_core" archive --format=tar -o "$BEFORE/vvj_core.tar" "$BASE"
      tar -xf "$BEFORE/vvj_core.tar" -C "$BEFORE/vvj_core"
      test -f "$BEFORE/vvj_core/vvj_core.info.yml" || { echo "baseline extract of vvj_core is empty"; exit 1; }
      for m in vvja vvjb vvjc vvjf vvjh vvjl vvjp vvjr vvjs vvjt; do
        mkdir "$BEFORE/$m"
        git -C "$LANE/$m" archive --format=tar -o "$BEFORE/$m.tar" HEAD
        tar -xf "$BEFORE/$m.tar" -C "$BEFORE/$m"
      done
      RC=0
      python3 -I "$LANE/vvj_core/scripts/check-vvj-cascade.py" --lane "$LANE" --vvj "$LANE" --before "$BEFORE" > "$LANE/cascade.out" 2>&1 || RC=$?
      cat "$LANE/cascade.out"
      if [ "$RC" -ne 0 ]; then echo "vvj-cascade FAILED (exit $RC)"; exit "$RC"; fi
      if [ "$(grep -c '(11 repos)' "$LANE/cascade.out")" -ne 1 ]; then
        echo "vvj-cascade checked fewer than 11 repos: the pass above is not a pass."
        exit 1
      fi

################
# VVJ motion check (static, no site, no browser).
#
# scripts/check-vvj-motion.py fails on a hover rule that moves its own box (the
# shake), a mode button rule or handler that reaches both hover and click mode,
# a document/window listener, timer or observer with no removal, and a behavior
# without once(). Rules and examples: docs/JS-RULES.md. No baseline: it reads
# the current tree of all eleven VVJ repos, cloned the same way as vvj-cascade.
#   - If any of the ten cannot be cloned, the job prints SKIPPED and the names,
#     and the check did NOT run. It never reports a pass for a check that did not run.
# Coverage line to read in the log: "11 repos". The job fails if it is not 11.
################
vvj-motion:
  stage: validate
  image: python:3.12-bookworm
  script:
    - |
      LANE=$(mktemp -d "${TMPDIR:-/tmp}/vvj-lane.XXXXXX")
      cp -R "$CI_PROJECT_DIR" "$LANE/vvj_core"
      MISSING=""
      for m in vvja vvjb vvjc vvjf vvjh vvjl vvjp vvjr vvjs vvjt; do
        git clone --quiet --depth 1 "https://git.drupalcode.org/project/$m.git" "$LANE/$m" || MISSING="$MISSING $m"
      done
      if [ -n "$MISSING" ]; then
        echo "SKIPPED vvj-motion: could not clone from git.drupalcode.org:$MISSING. The check needs all ten format modules and did NOT run."
        exit 0
      fi
      python3 -I "$LANE/vvj_core/scripts/check-vvj-motion.py" --self-test
      RC=0
      python3 -I "$LANE/vvj_core/scripts/check-vvj-motion.py" > "$LANE/motion.out" 2>&1 || RC=$?
      cat "$LANE/motion.out"
      if [ "$RC" -ne 0 ]; then echo "vvj-motion FAILED (exit $RC)"; exit "$RC"; fi
      if [ "$(grep -c '; 11 repos' "$LANE/motion.out")" -ne 1 ]; then
        echo "vvj-motion checked fewer than 11 repos: the pass above is not a pass."
        exit 1
      fi

################
# VVJ bridge drift check (static, no site, no browser).
#
# scripts/check-vvj-bridges.py fails when a bridge library declares `dependencies`
# (the vvjh/vvjl loop was a 2 GB memory fatal), when a module bridge sets a
# --vvjX-* token its patterns/*-pattern-base.css never declares, or when a shared
# --vvj-theme-* role exists in only one of the two shared bridges. Cloned the
# same way as vvj-cascade; the same SKIPPED rule applies (never a pass when it did not run).
# Coverage line to read in the log: "20 module bridges" (10 modules x Solo and APEX).
# The job runs --self-test first (one planted defect per check must go red).
################
vvj-bridges:
  stage: validate
  image: python:3.12-bookworm
  script:
    - |
      LANE=$(mktemp -d "${TMPDIR:-/tmp}/vvj-lane.XXXXXX")
      cp -R "$CI_PROJECT_DIR" "$LANE/vvj_core"
      MISSING=""
      for m in vvja vvjb vvjc vvjf vvjh vvjl vvjp vvjr vvjs vvjt; do
        git clone --quiet --depth 1 "https://git.drupalcode.org/project/$m.git" "$LANE/$m" || MISSING="$MISSING $m"
      done
      if [ -n "$MISSING" ]; then
        echo "SKIPPED vvj-bridges: could not clone from git.drupalcode.org:$MISSING. The check needs all ten format modules and did NOT run."
        exit 0
      fi
      python3 -I "$LANE/vvj_core/scripts/check-vvj-bridges.py" --self-test
      RC=0
      python3 -I "$LANE/vvj_core/scripts/check-vvj-bridges.py" --lane "$LANE" > "$LANE/bridges.out" 2>&1 || RC=$?
      cat "$LANE/bridges.out"
      if [ "$RC" -ne 0 ]; then echo "vvj-bridges FAILED (exit $RC)"; exit "$RC"; fi
      if [ "$(grep -c ', 20 module bridges,' "$LANE/bridges.out")" -ne 1 ]; then
        echo "vvj-bridges checked fewer than 20 module bridges: the pass above is not a pass."
        exit 1
      fi
