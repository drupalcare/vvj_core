base:
  css:
    theme:
      css/vvj-patterns-base.css: {}
  dependencies:
    - vvj_core/tokens

# Theme bridges: added to "base" by VvjPatternsLibraryInfoAlterHook when the
# active theme is Solo, APEX or W3CSS (or a sub-theme of one). Weight 100 puts
# them after vvj-patterns-base.css, so they replace its black-and-white
# color tokens. Other themes get no bridge.
theme-bridge-solo:
  css:
    theme:
      css/bridge/vvj-patterns-bridge-solo.css: { weight: 100 }

theme-bridge-apex:
  css:
    theme:
      css/bridge/vvj-patterns-bridge-apex.css: { weight: 100 }

theme-bridge-w3css:
  css:
    theme:
      css/bridge/vvj-patterns-bridge-w3css.css: { weight: 100 }

state:
  js:
    js/vvj-state.js: {}
  dependencies:
    - core/drupal
    - vvj_core/element-base

scroll-strip:
  js:
    js/vvj-scroll-strip.js: {}
  dependencies:
    - core/drupal
    - core/drupal.debounce
    - vvj_core/element-base

split-text:
  js:
    js/vvj-split-text.js: {}
  dependencies:
    - core/drupal

count-up:
  js:
    js/vvj-count-up.js: {}
  dependencies:
    - core/drupal
    - vvj_core/element-base

segmented:
  js:
    js/vvj-segmented.js: {}
  dependencies:
    - core/drupal
    - vvj_core/keyboard-nav

autoplay:
  js:
    js/vvj-autoplay.js: {}
  dependencies:
    - core/drupal
    - vvj_core/element-base

origin:
  js:
    js/vvj-origin.js: {}
  dependencies:
    - core/drupal
